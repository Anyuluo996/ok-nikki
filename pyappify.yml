name: "ok-nikki"
uac: true
icon: "icons/icon.png"
profiles:
  - name: "China"
    git_url: "https://github.com/Anyuluo996/ok-nikki.git" # 增量更新源(与 origin 一致)
    admin: true
    main_script: "main.py"
    requires_python: "3.12"
    requirements: "requirements.txt"
    pip_args: "--no-deps"
    use_pythonw: true
    show_add_defender: true
    # PYTHONPATH: "your/default/path" # Optional, will be "" if missing

  - name: "Web"
    main_script: "web_main.py"
    requires_python: "3.12"
    requirements: "requirements-web.txt"
    pip_args: "--no-deps"
    use_pythonw: true
